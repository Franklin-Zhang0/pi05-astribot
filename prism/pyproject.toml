[project]
name = "prism-engram-inference"
version = "0.1.0"
description = "Standalone, stateful Engram PRISM inference with OpenPI-compatible transport"
readme = "README.md"
authors = [
    { name = "Franklin-Zhang0", email = "franklin.zhang@qq.com" }
]
requires-python = "==3.12.12"
dependencies = [
    "numpy==2.2.6", "opencv-python-headless==4.11.0.86",
    "websockets==15.0.1", "msgpack==1.1.1",
    "torch==2.11.0+cu128", "torchvision==0.26.0+cu128",
    "transformers==5.4.0", "accelerate==1.13.0", "timm==1.0.26",
    "einops==0.8.2", "scipy==1.15.3", "pillow==12.1.1",
    "safetensors==0.7.0", "huggingface-hub==1.8.0",
    "flash-linear-attention==0.5.1", "fla-core==0.5.1",
    "triton==3.3.1", "tilelang==0.1.12", "apache-tvm-ffi==0.1.11",
]

[project.optional-dependencies]
native-conv = ["causal-conv1d==1.6.2.post1", "setuptools==81.0.0", "wheel==0.45.1"]

[project.scripts]
prism-serve = "prism_engram.server:main"
prism-export = "prism_engram.bundle:main"

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.8.6"]

[tool.uv]
required-version = ">=0.8.22"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'"]
override-dependencies = ["triton==3.3.1"]
no-build-isolation-package = ["causal-conv1d"]

[tool.uv.workspace]
members = []

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/prism_engram", "src/prism_vla"]

[tool.hatch.build.targets.wheel.force-include]
"runtime_source_manifest.json" = "prism_engram/runtime_source_manifest.json"
"RUNTIME_SOURCES.md" = "prism_engram/RUNTIME_SOURCES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
